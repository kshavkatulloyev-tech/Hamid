<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>O2 → O3</title>
<style>
@font-face{font-family:'Inter';src:url(__F_LAT__) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Inter';src:url(__F_CYR__) format('woff2');font-weight:100 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Inter';src:url(__F_CYX__) format('woff2');font-weight:100 900;unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B0C;}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0B0B0C;}
.d3{position:absolute;left:0;top:0;width:1080px;height:1920px;}
.world{position:absolute;width:0;height:0;transform-style:preserve-3d;}
.letter,.layer{position:absolute;left:0;top:0;transform-origin:0 0;transform-style:preserve-3d;}
.layer{font-family:'Inter';font-weight:900;white-space:pre;line-height:1;}
svg{position:absolute;left:0;top:0;}
text{font-family:'Inter';}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs id="defs"></defs>
    <g id="root"></g>
  </svg>
  <div id="type3d" class="d3"><div class="world" id="typeWorld"></div></div>
  <svg id="svg2" width="1080" height="1920" viewBox="0 0 1080 1920"><g id="top"></g></svg>
</div>
<script>
// ------------------------------------------------------------------ basics
const W = 1080, H = 1920, CX = 540, CY = 740, DUR = 15, K = 1.5, OUT = DUR * K, DT = 1 / (120 * K);
const COL = { k: '#0B0B0C', w: '#F2EFE8', t: '#17C2AE', b: '#2E4BFF', y: '#FFC83A' };
const PH = { p1: '__P1__', p2: '__P2__', p3: '__P3__', p4: '__P4__' };
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, t0, d) => clamp((t - t0) / d);
const eOut = x => x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10));
const eIn = x => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x) - 1) / (Math.pow(2, 10) - 1);
const eIO = x => x < 0.5 ? eIn(2 * x) / 2 : 0.5 + eOut(2 * x - 1) / 2;
const spr = (dt, w = 16) => dt <= 0 ? 0 : 1 - (1 + w * dt) * Math.exp(-w * dt);
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mixC = (a, b, x) => { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(x)))).join(',')})`; };
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, parent = $('root')) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
function show(e, v) { e.style.display = v ? '' : 'none'; }
function hdiv(cls, parent) { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; }
let blurN = 0;
function blur(e, dx, dy) {
  const sx = Math.min(30, Math.abs(dx) * 0.55), sy = Math.min(30, Math.abs(dy) * 0.55);
  if (sx < 0.4 && sy < 0.4) { e.removeAttribute('filter'); return; }
  if (!e._f) {
    const id = 'bl' + (blurN++);
    const f = el('filter', { id, filterUnits: 'userSpaceOnUse', x: -300, y: -300, width: 1680, height: 2520 }, $('defs'));
    e._g = el('feGaussianBlur', { stdDeviation: '0 0' }, f); e._f = id;
  }
  e._g.setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`);
  e.setAttribute('filter', `url(#${e._f})`);
}
let clipN = 0;
function clipRect(parent) { const id = 'c' + (clipN++); const cp = el('clipPath', { id }, $('defs')); const r = el('rect', { x: 0, y: 0, width: W, height: H }, cp); const g = el('g', { 'clip-path': `url(#${id})` }, parent); return { g, r }; }

// ------------------------------------------------------------------ type
const CAP = 0.727;
let measurer;
function charW(ch, size, weight) {
  if (ch === ' ') return 0.27 * size;
  measurer.setAttribute('font-size', size); measurer.setAttribute('font-weight', weight);
  measurer.textContent = ch; return measurer.getComputedTextLength();
}
function makeWord(str, size, { cy = CY, cx = CX, track = -0.02, weight = 900, fill = COL.w, parent = $('root') } = {}) {
  const g = el('g', {}, parent);
  const chars = [...str]; const tr = track * size; let x = 0; const L = [];
  chars.forEach((ch, i) => {
    const w = charW(ch, size, weight);
    const t = el('text', { 'font-size': size, 'font-weight': weight, fill, x: 0, y: 0 }, g);
    t.textContent = ch; L.push({ ch, el: t, x, w }); x += w + (i < chars.length - 1 ? tr : 0);
  });
  const width = x;
  L.forEach(l => { l.x0 = cx - width / 2 + l.x; l.cx = l.x0 + l.w / 2; });
  return { g, L, width, size, capH: CAP * size, base: cy + CAP * size / 2, cy };
}
function place(l, x, y, ops = '') { l.el.setAttribute('transform', `translate(${x.toFixed(2)},${y.toFixed(2)}) ${ops}`); }
// "ОЗОН" with geometric rings for the О's
function makeOzon(size, cy, ringCol, parent) {
  const capH = CAP * size, ringW = capH * 1.03, sw = capH * 0.235, tr = -0.01 * size;
  const g = el('g', {}, parent);
  const spec = ['O', 'З', 'O', 'Н']; let x = 0; const items = [];
  spec.forEach((s, i) => {
    let it;
    if (s === 'O') { const c = el('circle', { fill: 'none', stroke: ringCol, 'stroke-width': sw, r: (ringW - sw) / 2 }, g); it = { ring: true, el: c, w: ringW, x }; }
    else { const w = charW(s, size, 900); const t = el('text', { 'font-size': size, 'font-weight': 900, fill: COL.w, x: 0, y: 0 }, g); t.textContent = s; it = { ring: false, el: t, w, x }; }
    items.push(it); x += it.w + (i < 3 ? tr : 0);
  });
  items.forEach(it => { it.x0 = CX - x / 2 + it.x; it.cx = it.x0 + it.w / 2; });
  return { g, items, width: x, capH, ringW, sw, cy, base: cy + capH / 2 };
}

// ------------------------------------------------------------------ build
let S = {};
function img(href, parent) { return el('image', { href, preserveAspectRatio: 'xMidYMid slice' }, parent); }
function build() {
  measurer = el('text', { x: -9999, y: -9999 }, $('defs'));
  const R = $('root');

  // ---- HOOK
  S.hook = el('g', {}, R);
  const hc = clipRect(S.hook); S.hookClip = hc.r;
  S.oz1 = makeOzon(230, CY - 40, COL.w, hc.g);
  // per-item emergence clips
  S.oz1.items.forEach((it, i) => {
    if (i === 0) return;
    const cp = el('clipPath', { id: 'oz1c' + i }, $('defs')); it.clip = el('rect', { x: 0, y: 0, width: W, height: H }, cp);
    const g = el('g', { 'clip-path': `url(#oz1c${i})` }, S.oz1.g); g.appendChild(it.el);
  });
  const tc = clipRect(S.hook); S.terClip = tc.r;
  S.ter = makeWord('ТЕРАПИЯ', 112, { cy: CY + 150, fill: COL.t, parent: tc.g });
  S.tag = el('g', {}, S.hook);
  S.tagPill = el('rect', { fill: COL.y, rx: 34, height: 68 }, S.tag);
  S.tagTxt = el('text', { 'font-size': 36, 'font-weight': 800, fill: COL.k, 'text-anchor': 'middle', x: CX, y: CY - 255 }, S.tag);
  S.tagTxt.textContent = 'БУ НИМА?';
  S.tagW = 300;

  // ---- KINETIC
  S.kin = el('g', {}, R);
  const kc = clipRect(S.kin); S.kisClip = kc.r;
  S.KIS = makeWord('КИСЛОРОД', 128, { parent: kc.g });
  S.ATOM = makeWord('+1 АТОМ', 140, { parent: S.kin });
  S.ATOM.L[0].el.setAttribute('fill', COL.y); S.ATOM.L[1].el.setAttribute('fill', COL.y);
  S.EQ = makeWord('=', 300, { parent: S.kin, fill: COL.y });
  S.oz2 = makeOzon(230, CY, COL.t, S.kin);

  // ---- MOLECULE (2D + projected 3D)
  S.mol = el('g', {}, R);
  S.bond = el('polyline', { fill: 'none', stroke: COL.t, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, S.mol);
  S.atomLayer = el('g', {}, S.mol);
  S.atoms = [0, 1, 2].map(i => {
    const g = el('g', {}, S.atomLayer);
    const disc = el('circle', {}, g);
    const cpid = 'ac' + i; const cp = el('clipPath', { id: cpid }, $('defs')); const cc = el('circle', {}, cp);
    const inner = el('g', { 'clip-path': `url(#${cpid})` }, g);
    const shade = el('path', { fill: '#000', 'fill-opacity': 0.3, 'fill-rule': 'evenodd' }, inner);
    const pcp = 'pc' + i; const pc = el('clipPath', { id: pcp }, $('defs')); const pcc = el('circle', {}, pc);
    const photo = img([PH.p1, PH.p2, PH.p3][i], el('g', { 'clip-path': `url(#${pcp})` }, g));
    return { g, disc, cc, shade, pcc, photo };
  });
  S.o3 = el('g', {}, R);
  S.o3t = el('text', { 'font-size': 96, 'font-weight': 900, fill: COL.y, 'text-anchor': 'middle', x: 0, y: 0 }, S.o3);
  S.o3t.innerHTML = 'O<tspan font-size="56" dy="18">3</tspan>';

  // ---- STAFF ROWS
  S.rows = el('g', {}, R);
  const RT = [['Тажрибали', 'ҳамширалар'], ['Стерил', 'шароит'], ['Шахсий', 'ёндашув']];
  S.rowY = [520, 760, 1000];
  S.rowEls = RT.map((pair, i) => {
    const c = clipRect(S.rows);
    const t1 = el('text', { 'font-size': 54, 'font-weight': 900, fill: COL.w, x: 0, y: 0 }, c.g); t1.textContent = pair[0];
    const t2 = el('text', { 'font-size': 54, 'font-weight': 900, fill: COL.t, x: 0, y: 0 }, c.g); t2.textContent = pair[1];
    const rule = el('rect', { fill: COL.y, height: 8 }, S.rows);
    return { clip: c.r, t1, t2, rule };
  });

  // ---- UI CARD
  S.ui = el('g', {}, R);
  const cardHalf = (dir) => { const x0 = CX, L = 150, Rr = 930, T = 330, B = 1250, r = 48;
    return dir < 0 ? `M${x0},${B} H${L + r} A${r},${r} 0 0 1 ${L},${B - r} V${T + r} A${r},${r} 0 0 1 ${L + r},${T} H${x0}`
                   : `M${x0},${B} H${Rr - r} A${r},${r} 0 0 0 ${Rr},${B - r} V${T + r} A${r},${r} 0 0 0 ${Rr - r},${T} H${x0}`; };
  S.cardL = el('path', { d: cardHalf(-1), fill: 'none', stroke: COL.w, 'stroke-width': 3 }, S.ui);
  S.cardR = el('path', { d: cardHalf(1), fill: 'none', stroke: COL.w, 'stroke-width': 3 }, S.ui);
  S.cardLen = S.cardL.getTotalLength();
  const avc = el('clipPath', { id: 'avc' }, $('defs')); S.avCirc = el('circle', { cx: 250, cy: 440, r: 0 }, avc);
  S.avatar = img(PH.p4, el('g', { 'clip-path': 'url(#avc)' }, S.ui)); set(S.avatar, { x: 200, y: 390, width: 100, height: 100 });
  const hcl = clipRect(S.ui); set(hcl.r, { x: 300, y: 380, width: 640, height: 120 });
  S.h1 = el('text', { 'font-size': 46, 'font-weight': 900, fill: COL.w, x: 328, y: 0 }, hcl.g); S.h1.textContent = 'Озонотерапия';
  S.h2 = el('text', { 'font-size': 30, 'font-weight': 700, fill: COL.t, x: 328, y: 0 }, hcl.g); S.h2.textContent = 'Мутахассис маслаҳати';
  S.div = el('rect', { fill: COL.w, 'fill-opacity': 0.25, height: 2, y: 545 }, S.ui);
  S.lbl1 = el('text', { 'font-size': 28, 'font-weight': 700, fill: COL.w, 'fill-opacity': 0.7, x: 190, y: 615, 'letter-spacing': 3 }, S.ui); S.lbl1.textContent = 'КУННИ ТАНЛАНГ';
  S.lbl2 = el('text', { 'font-size': 28, 'font-weight': 700, fill: COL.w, 'fill-opacity': 0.7, x: 190, y: 845, 'letter-spacing': 3 }, S.ui); S.lbl2.textContent = 'ВАҚТНИ ТАНЛАНГ';
  S.daySel = el('rect', { fill: COL.t, rx: 24, width: 120, height: 120, y: 640 }, S.ui);
  S.days = ['Ду', 'Се', 'Чо', 'Па', 'Жу'].map((d, i) => {
    const g = el('g', {}, S.ui); const x = 190 + i * 145;
    const r = el('rect', { x: -60, y: -60, width: 120, height: 120, rx: 24, fill: 'none', stroke: COL.w, 'stroke-width': 2.5 }, g);
    const t = el('text', { 'font-size': 38, 'font-weight': 800, fill: COL.w, 'text-anchor': 'middle', x: 0, y: 13 }, g); t.textContent = d;
    return { g, x: x + 60, y: 700 };
  });
  S.timeSel = el('rect', { fill: COL.t, rx: 24, width: 220, height: 96, y: 872 }, S.ui);
  S.times = ['10:00', '14:00', '16:00'].map((d, i) => {
    const g = el('g', {}, S.ui); const x = 190 + i * 240;
    el('rect', { x: -110, y: -48, width: 220, height: 96, rx: 24, fill: 'none', stroke: COL.w, 'stroke-width': 2.5 }, g);
    const t = el('text', { 'font-size': 38, 'font-weight': 800, fill: COL.w, 'text-anchor': 'middle', x: 0, y: 13 }, g); t.textContent = d;
    t.style.fontVariantNumeric = 'tabular-nums';
    return { g, x: x + 110, y: 920 };
  });
  S.pillG = el('g', {}, R);
  S.pillDisc = el('circle', { fill: COL.b }, S.pillG);
  S.pill = el('rect', {}, S.pillG);
  S.pillTxt = el('text', { 'font-size': 40, 'font-weight': 900, fill: COL.k, 'text-anchor': 'middle', x: 0, y: 14 }, S.pillG); S.pillTxt.textContent = 'Маслаҳатга ёзилиш';
  S.cursor = el('g', {}, R);
  el('circle', { r: 24, fill: COL.w }, S.cursor); el('circle', { r: 40, fill: 'none', stroke: COL.w, 'stroke-width': 3 }, S.cursor);

  // ---- TITLE
  S.TS = 124; S.lineCY = [470, 620, 770];
  S.tLines = ['ҲАБИБУЛЛО', 'ШАМС', 'КЛИНИКАСИ'].map((s, i) => makeWord(s, S.TS, { cy: S.lineCY[i], parent: el('g', {}, $('top')) }));
  S.title2d = S.tLines.map(w => w.g);
  S.tw = $('typeWorld'); S.tw.style.left = CX + 'px'; S.tw.style.top = '620px';
  S.tletters = [];
  S.tLines.forEach((w, li) => w.L.forEach((l, i) => {
    const d = hdiv('letter', S.tw); const layers = []; const NL = 14;
    for (let k = 0; k < NL; k++) { const s = hdiv('layer', d); s.textContent = l.ch; s.style.fontSize = S.TS + 'px'; s.style.color = k === 0 ? COL.w : (k < NL - 5 ? COL.t : COL.b); layers.push(s); }
    layers.slice().reverse().forEach(s => d.appendChild(s));
    S.tletters.push({ el: d, layers, l, li, i });
  }));
  S.ybars = [0, 1, 2].map(() => el('rect', { fill: COL.y }, $('top')));
  S.under = el('rect', { fill: COL.y }, $('top'));
  const pc = clipRect($('top')); S.phClip = pc.r;
  S.phone = el('text', { 'font-size': 92, 'font-weight': 900, fill: COL.w, 'text-anchor': 'middle', x: CX, y: 0 }, pc.g); S.phone.textContent = '93 963 10 95';
  S.phone.style.fontVariantNumeric = 'tabular-nums';
  const cc2 = clipRect($('top')); S.ctaClip = cc2.r;
  S.cta = el('text', { 'font-size': 44, 'font-weight': 900, fill: COL.y, 'text-anchor': 'middle', x: CX, y: 0 }, cc2.g); S.cta.textContent = 'Маслаҳатга ёзилинг';
  S.disc = el('text', { 'font-size': 26, 'font-weight': 600, fill: COL.w, 'fill-opacity': 0.72, 'text-anchor': 'middle', x: CX, y: 0 }, cc2.g);
  S.disc.textContent = 'Қарши кўрсатмалар мавжуд. Шифокор билан маслаҳатлашинг.';
  S.endG = [S.title2d, S.under, S.phone, S.cta, S.disc];
  S.loopRing = el('circle', { fill: 'none', stroke: COL.w }, $('top'));
}

// ------------------------------------------------------------------ HOOK 0–2.2
function ozItemX(t, i) {
  const it = S.oz1.items;
  const r0 = lerp(CX, it[0].cx, eOut(seg(t, 0, 0.42)));
  if (i === 0) return r0;
  if (i === 1) { const B = r0 + it[0].w / 2; return lerp(B - it[1].w / 2, it[1].cx, eOut(seg(t, 0.04, 0.4))); }
  if (i === 2) { const B = it[1].x0 + it[1].w; return lerp(B - it[2].w / 2, it[2].cx, eOut(seg(t, 0.5, 0.36))); }
  const B = it[2].x0 + it[2].w; return lerp(B - it[3].w / 2, it[3].cx, eOut(seg(t, 0.6, 0.36)));
}
function drawHook(t) {
  const on = t < 2.3; show(S.hook, on); if (!on) return;
  const oz = S.oz1;
  set(S.hookClip, { height: oz.base + 2 });
  const sink = (tt, i) => oz.capH * 1.1 * eIn(seg(tt, 2.0 + i * 0.02, 0.15));
  oz.items.forEach((it, i) => {
    const x = ozItemX(t, i), px = ozItemX(t - DT, i);
    const vis = i === 0 || i === 1 || t >= 0.5 - (i === 2 ? 0 : -0.1);
    show(it.el, i < 2 || t >= (i === 2 ? 0.5 : 0.6));
    const dy = sink(t, i);
    if (it.ring) set(it.el, { cx: x, cy: oz.cy + dy });
    else { it.el.setAttribute('transform', `translate(${(x - it.w / 2).toFixed(2)},${(oz.base + dy).toFixed(2)})`); }
    blur(it.el, x - px, dy - sink(t - DT, i));
    if (it.clip) {
      const B = i === 1 ? ozItemX(t, 0) + oz.items[0].w / 2 : (i === 2 ? oz.items[1].x0 + oz.items[1].w : oz.items[2].x0 + oz.items[2].w);
      set(it.clip, { x: B, width: W });
    }
  });
  // ТЕРАПИЯ rises letter by letter from its baseline
  set(S.terClip, { height: S.ter.base + 2 });
  show(S.ter.g, t >= 1.0);
  S.ter.L.forEach((l, i) => {
    const sy = Math.max(0.001, spr(t - (1.0 + i * 0.03), 20));
    const dy = S.ter.capH * 1.1 * eIn(seg(t, 2.02 + i * 0.015, 0.15));
    place(l, l.x0, S.ter.base + dy, `scale(1,${sy.toFixed(3)})`);
  });
  // tag wipes in on beat 4
  const tw = S.tagW * eOut(seg(t, 1.5, 0.3)) * (1 - eIn(seg(t, 2.0, 0.14)));
  show(S.tag, tw > 1);
  set(S.tagPill, { x: CX - tw / 2, y: CY - 300, width: tw, rx: Math.min(34, tw / 2) });
  const ts = clamp((tw - 200) / 100);
  set(S.tagTxt, { transform: `translate(${CX},${CY - 255}) scale(${ts.toFixed(3)},1) translate(${-CX},${-(CY - 255)})` });
}

// ------------------------------------------------------------------ KINETIC 2–4
function drawKin(t) {
  const on = t >= 2.0 && t < 4.0; show(S.kin, on); if (!on) return;
  // КИСЛОРОД hinges up out of the baseline, conveyor out
  set(S.kisClip, { height: S.KIS.base + 3 });
  const kx = (tt, i) => -W * 1.1 * eIO(seg(tt, 2.5 + i * 0.012, 0.4));
  show(S.KIS.g, t < 2.95);
  S.KIS.L.forEach((l, i) => {
    const rot = 90 * (1 - spr(t - (2.1 + i * 0.03), 18));
    place(l, l.x0 + kx(t, i), S.KIS.base, `rotate(${rot.toFixed(2)})`);
    blur(l.el, kx(t, i) - kx(t - DT, i), 0);
  });
  // +1 АТОМ conveyor in, squash out
  const ax = (tt, i) => W * 1.1 * (1 - eIO(seg(tt, 2.5 + i * 0.012, 0.4)));
  show(S.ATOM.g, t >= 2.5 && t < 3.2);
  S.ATOM.L.forEach((l, i) => {
    const sy = Math.max(0.001, 1 - eIn(seg(t, 3.0 + i * 0.015, 0.1)));
    place(l, l.x0 + ax(t, i), S.ATOM.base, `scale(1,${sy.toFixed(3)})`);
    blur(l.el, ax(t, i) - ax(t - DT, i), 0);
  });
  // = rises, then its bars shoot apart vertically
  show(S.EQ.g, t >= 3.1 && t < 3.72);
  { const l = S.EQ.L[0]; const sy = Math.max(0.001, spr(t - 3.1, 20) * (1 - eIn(seg(t, 3.5, 0.16))));
    const sx = 1 + 1.6 * eIn(seg(t, 3.5, 0.16));
    place(l, l.x0, CY, `translate(${l.w / 2},0) scale(${sx.toFixed(3)},${sy.toFixed(3)}) translate(${-l.w / 2},${S.EQ.capH / 2})`); }
  // ОЗОН slams in (alternating from above / below); З and Н drop; rings fill into atoms
  const oz = S.oz2;
  show(oz.g, t >= 3.52);
  const fill = eOut(seg(t, 3.78, 0.2)), gather = eIO(seg(t, 3.76, 0.24));
  oz.items.forEach((it, i) => {
    const fy = (tt) => (i % 2 ? 1 : -1) * 1100 * (1 - eOut(seg(tt, 3.52 + i * 0.025, 0.2)));

  return btoa(bin);
};

window.ready = (async () => {
  for (const w of [600, 700, 800, 900]) await document.fonts.load(`${w} 100px Inter`, 'АҲқғўЁ');
  await document.fonts.ready;
  build(); window.seek(0); return true;
})();
